<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crop Price Prediction Dashboard</title>
    <style>
        :root {
            --primary-color: #1f7a4b;
            --primary-dark: #123d27;
            --secondary-color: #d9f5e7;
            --accent-color: #f59e0b;
            --text-color: #21312a;
            --muted-text: #5d6965;
            --light-bg: #f4faf6;
            --card-border: rgba(31, 122, 75, 0.12);
            --white: #ffffff;
            --error-color: #dc2626;
            --error-bg: #fef2f2;
            --shadow: 0 20px 40px rgba(18, 61, 39, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e8f8ef 0%, #d5f3df 28%, #c7e7d2 100%);
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
        }

        .container {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 30px 28px 24px;
            width: 100%;
            max-width: 540px;
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }

        .header {
            text-align: center;
            margin-bottom: 26px;
        }

        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--secondary-color);
            color: var(--primary-dark);
            font-weight: 700;
            letter-spacing: 0.04em;
            font-size: 11px;
            text-transform: uppercase;
        }

        .header h2 {
            color: var(--primary-dark);
            margin: 14px 0 8px;
            font-size: 30px;
            line-height: 1.2;
            font-weight: 700;
        }

        .header p {
            color: var(--muted-text);
            margin: 0;
            font-size: 14px;
            line-height: 1.5;
        }

        .input-panel {
            background: linear-gradient(180deg, rgba(31, 122, 75, 0.04), rgba(31, 122, 75, 0.02));
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group:last-child {
            margin-bottom: 0;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-color);
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid rgba(31, 122, 75, 0.12);
            border-radius: 10px;
            font-size: 15px;
            transition: border 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
            background-color: #fff;
            color: var(--text-color);
        }

        .form-control:focus {
            outline: none;
            border-color: rgba(31, 122, 75, 0.7);
            box-shadow: 0 0 0 4px rgba(31, 122, 75, 0.12);
        }

        select.form-control {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
        }

        .btn {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            color: white;
            border: none;
            padding: 14px 16px;
            width: 100%;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 12px 24px rgba(18, 61, 39, 0.2);
        }

        .btn:hover {
            transform: translateY(-1px);
        }

        .loader {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.4);
            border-top-color: var(--white);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .results {
            margin-top: 22px;
            display: none;
            animation: fadeIn 0.35s ease;
        }

        .result-card {
            background: var(--light-bg);
            border: 1px solid var(--card-border);
            border-radius: 14px;
            padding: 18px 16px;
            margin-bottom: 14px;
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            padding: 2px 0;
            margin-bottom: 8px;
        }

        .result-row:last-child {
            margin-bottom: 0;
        }

        .result-label {
            font-weight: 600;
            color: var(--muted-text);
        }

        .result-value {
            font-weight: 700;
            color: var(--primary-dark);
            text-align: right;
        }

        .price-highlight {
            font-size: 30px;
            font-weight: 800;
            color: var(--accent-color);
            text-align: center;
            margin: 18px 0 16px;
            letter-spacing: -0.02em;
        }

        .price-highlight small {
            font-size: 14px;
            color: var(--muted-text);
        }

        .error-message {
            color: var(--error-color);
            background-color: var(--error-bg);
            border: 1px solid rgba(220, 38, 38, 0.15);
            padding: 12px 14px;
            border-radius: 10px;
            margin-top: 14px;
            display: none;
            font-size: 14px;
            line-height: 1.4;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 600px) {
            .container {
                padding: 22px 16px 18px;
            }
            .header h2 {
                font-size: 26px;
            }
            .price-highlight {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <span class="badge">Agriculture AI</span>
            <h2>Crop Price Prediction</h2>
            <p>Forecasts for Groundnut and Paddy based on month, season, and market conditions.</p>
        </div>

        <div class="input-panel">
            <div class="form-group">
                <label for="year">Year</label>
                <input type="number" id="year" class="form-control" 
                       placeholder="e.g., 2023" 
                       min="2000" max="2030" 
                       value="2023" required>
            </div>

            <div class="form-group">
                <label for="month-or-season">Time Period</label>
                <select id="month-or-season" class="form-control" onchange="toggleInput()" required>
                    <option value="">Select Month or Season</option>
                    <option value="Month">Month</option>
                    <option value="Season">Season</option>
                </select>
            </div>

            <div class="form-group" id="month-group" style="display: none;">
                <label for="month">Month</label>
                <select id="month" class="form-control">
                    <option value="">Select Month</option>
                    <option value="January">January</option>
                    <option value="February">February</option>
                    <option value="March">March</option>
                    <option value="April">April</option>
                    <option value="May">May</option>
                    <option value="June">June</option>
                    <option value="July">July</option>
                    <option value="August">August</option>
                    <option value="September">September</option>
                    <option value="October">October</option>
                    <option value="November">November</option>
                    <option value="December">December</option>
                </select>
            </div>

            <div class="form-group" id="season-group" style="display: none;">
                <label for="season">Season</label>
                <select id="season" class="form-control">
                    <option value="">Select Season</option>
                    <option value="Kharif">Kharif (June-October)</option>
                    <option value="Rabi">Rabi (November-March)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="crop-name">Crop</label>
                <select id="crop-name" class="form-control" required>
                    <option value="">Select Crop</option>
                    <option value="Groundnut">Groundnut</option>
                    <option value="Paddy">Paddy</option>
                </select>
            </div>
        </div>

        <button class="btn" onclick="predictPrice()">
            <span id="btn-text">Predict Price</span>
            <div class="loader" id="loader"></div>
        </button>

        <div class="error-message" id="error-message"></div>

        <div class="results" id="results">
            <div class="result-card">
                <div class="result-row">
                    <span class="result-label">Crop</span>
                    <span class="result-value" id="predicted-crop">-</span>
                </div>
                <div class="result-row">
                    <span class="result-label">State</span>
                    <span class="result-value" id="predicted-state">Andhra Pradesh</span>
                </div>
                <div class="result-row">
                    <span class="result-label">Time period</span>
                    <span class="result-value" id="predicted-period">-</span>
                </div>
            </div>

            <div class="price-highlight">
                ₹<span id="predicted-price-kg">-</span> <small>/ kg</small>
            </div>

            <div class="result-card">
                <div class="result-row">
                    <span class="result-label">Price per quintal</span>
                    <span class="result-value">₹<span id="predicted-price-quintal">-</span></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleInput() {
            const selection = document.getElementById("month-or-season").value;
            document.getElementById("month-group").style.display = selection === "Month" ? "block" : "none";
            document.getElementById("season-group").style.display = selection === "Season" ? "block" : "none";
            
            if (selection === "Month") {
                document.getElementById("season").value = "";
            } else if (selection === "Season") {
                document.getElementById("month").value = "";
            }
        }

        function validateInputs() {
            const year = document.getElementById("year").value;
            const selection = document.getElementById("month-or-season").value;
            const month = selection === "Month" ? document.getElementById("month").value : "";
            const season = selection === "Season" ? document.getElementById("season").value : "";
            const cropName = document.getElementById("crop-name").value;
            
            document.getElementById("error-message").style.display = "none";
            
            if (!year || year < 2000 || year > 2030) {
                showError("Please enter a valid year between 2000 and 2030");
                return false;
            }
            
            if (!selection) {
                showError("Please select either Month or Season");
                return false;
            }
            
            if (selection === "Month" && !month) {
                showError("Please select a month");
                return false;
            }
            
            if (selection === "Season" && !season) {
                showError("Please select a season");
                return false;
            }
            
            if (!cropName) {
                showError("Please select a crop");
                return false;
            }
            
            return true;
        }

        function showError(message) {
            const errorElement = document.getElementById("error-message");
            errorElement.textContent = message;
            errorElement.style.display = "block";
        }

        function formatPrice(price) {
            return parseFloat(price).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }

        async function predictPrice() {
            if (!validateInputs()) return;
            
            const year = document.getElementById("year").value;
            const selection = document.getElementById("month-or-season").value;
            const month = selection === "Month" ? document.getElementById("month").value : "";
            const season = selection === "Season" ? document.getElementById("season").value : "";
            const cropName = document.getElementById("crop-name").value;
            
            document.getElementById("loader").style.display = "block";
            document.getElementById("btn-text").style.display = "none";
            document.getElementById("results").style.display = "none";
            
            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        year: parseInt(year),
                        month: month,
                        season: season,
                        crop_name: cropName
                    })
                });
                
                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || "Prediction failed. Please try again.");
                }
                
                const result = await response.json();
                
                document.getElementById("predicted-crop").textContent = result.crop_name;
                document.getElementById("predicted-price-kg").textContent = formatPrice(result.price_per_kg);
                document.getElementById("predicted-price-quintal").textContent = formatPrice(result.price_per_quintal);
                
                const periodElement = document.getElementById("predicted-period");
                if (month) {
                    periodElement.textContent = `${month} ${year}`;
                } else {
                    periodElement.textContent = `${season} Season ${year}`;
                }
                
                document.getElementById("results").style.display = "block";
                
            } catch (error) {
                showError(error.message || "An error occurred. Please try again.");
            } finally {
                document.getElementById("loader").style.display = "none";
                document.getElementById("btn-text").style.display = "block";
            }
        }
    </script>
</body>
</html>
